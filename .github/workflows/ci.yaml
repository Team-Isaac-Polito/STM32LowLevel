name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19
      - name: Check formatting
        working-directory: STM32LowLevel
        run: |
          find Core/Src Lib USB_Device \
            \( -name "*.cpp" -o -name "*.h" -o -name "*.tpp" \) \
            | xargs clang-format-19 --dry-run --Werror

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib clang-tidy-19
      - name: Configure (generate compile_commands.json)
        working-directory: STM32LowLevel
        run: cmake --preset MK2_MOD1
      - name: Check naming conventions
        working-directory: STM32LowLevel
        run: |
          ARM_SYSROOT=$(arm-none-eabi-gcc -print-sysroot)
          find Core/Src Lib \( -name "*.cpp" \) \
            | xargs clang-tidy-19 -p build/debug/MK2_MOD1 --extra-arg="--sysroot=${ARM_SYSROOT}" \
            2>&1 | tee /tmp/tidy_out.txt || true
          if grep -q "readability-identifier-naming" /tmp/tidy_out.txt; then
            echo "::error::Naming convention violations found"
            grep "readability-identifier-naming" /tmp/tidy_out.txt
            exit 1
          fi

  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: MK2_MOD1
            build-dir: build/debug/MK2_MOD1
          - preset: MK2_MOD2
            build-dir: build/debug/MK2_MOD2
          - preset: MK2_MOD3
            build-dir: build/debug/MK2_MOD3
          - preset: MK2_MOD1-release
            build-dir: build/release/MK2_MOD1
          - preset: MK2_MOD2-release
            build-dir: build/release/MK2_MOD2
          - preset: MK2_MOD3-release
            build-dir: build/release/MK2_MOD3
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi
      - name: Configure (${{ matrix.preset }})
        working-directory: STM32LowLevel
        run: cmake --preset ${{ matrix.preset }}
      - name: Build (${{ matrix.preset }})
        working-directory: STM32LowLevel
        run: cmake --build ${{ matrix.build-dir }}

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [format, lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
